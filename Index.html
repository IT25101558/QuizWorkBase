```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Will You Marry Me? ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Georgia, serif;

            background:
                radial-gradient(
                    circle at top,
                    #ffe8f0,
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #ffb6c9,
                    #d8a0d8
                );
        }


        /* =================================
           MAIN WHITE / PINK CARD
        ================================= */

        .card {

            width: min(90%, 620px);

            min-height: 470px;

            padding: 45px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.75);

            border-radius: 30px;

            border: 2px solid rgba(255,255,255,0.8);

            box-shadow:
                0 20px 60px rgba(100,20,60,0.25);

            backdrop-filter: blur(15px);

            position: relative;
        }


        /* =================================
           QUESTION
        ================================= */

        .ring {

            font-size: 65px;

            margin-bottom: 10px;

            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }


        h1 {

            margin: 10px 0;

            color: #8e164c;

            font-size: clamp(
                34px,
                7vw,
                55px
            );
        }


        .subtitle {

            color: #74304f;

            font-size: 19px;

            margin-bottom: 25px;
        }


        /* =================================
           BUTTON AREA
           
           THIS IS THE AREA WHERE
           THE NO BUTTON CAN MOVE
        ================================= */

        .button-area {

            position: relative;

            width: 100%;

            height: 130px;

            margin-top: 10px;

            /*
                Important:
                No button can leave this box.
            */

            overflow: hidden;

            border-radius: 20px;
        }


        /* =================================
           YES BUTTON
        ================================= */

        #yes {

            position: absolute;

            left: 50%;

            top: 50%;

            transform: translate(
                -110%,
                -50%
            );

            padding: 15px 35px;

            border: none;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #b91450,
                    #ef4c83
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(100,20,60,0.2);

            z-index: 2;
        }


        #yes:hover {

            transform:
                translate(-110%, -50%)
                scale(1.1);
        }


        /* =================================
           NO BUTTON
        ================================= */

        #no {

            position: absolute;

            /*
                Initial position
            */

            left: 55%;

            top: 50%;

            transform:
                translate(0, -50%);

            padding: 15px 35px;

            border: none;

            border-radius: 50px;

            background: white;

            color: #a13963;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(100,20,60,0.2);

            z-index: 3;

            white-space: nowrap;
        }


        #no:hover {

            background: #ffe8f0;
        }


        /* =================================
           SUCCESS
        ================================= */

        #success {

            display: none;
        }


        #success.show {

            display: block;
        }


        .big-heart {

            font-size: 90px;

            animation:
                heartbeat 1s infinite;
        }


        @keyframes heartbeat {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }


        #success h2 {

            color: #a41650;

            font-size: 45px;
        }


        #success p {

            color: #6b2947;

            font-size: 21px;

            line-height: 1.6;
        }


        /* =================================
           FLOATING HEARTS
        ================================= */

        .heart {

            position: fixed;

            bottom: -40px;

            pointer-events: none;

            animation:
                floatUp 6s linear infinite;

            z-index: 1;
        }


        @keyframes floatUp {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

    </style>
</head>


<body>


    <!-- =================================
         MAIN CARD
    ================================= -->

    <div class="card">


        <!-- QUESTION -->

        <div id="question">

            <div class="ring">
                💍
            </div>

            <h1>
                Will You Marry Me?
            </h1>

            <p class="subtitle">
                I have one very important question for you... ❤️
            </p>


            <!--
                ONLY THIS AREA IS USED
                BY THE NO BUTTON
            -->

            <div class="button-area">

                <button id="yes">
                    Yes 💖
                </button>

                <button id="no">
                    No 🙈
                </button>

            </div>

        </div>


        <!-- =================================
             SUCCESS MESSAGE
        ================================= -->

        <div id="success">

            <div class="big-heart">
                ❤️
            </div>

            <h2>
                YAAAAAY! 🥰
            </h2>

            <p>
                You said YES! 💍
                <br><br>

                You just made me the happiest
                person in the world.
                <br>

                Forever starts now. ❤️✨
            </p>

        </div>


    </div>


    <!-- BACKGROUND HEARTS -->

    <div class="heart"
         style="left:10%; animation-delay:0s;">
        ❤️
    </div>

    <div class="heart"
         style="left:30%; animation-delay:2s;">
        💕
    </div>

    <div class="heart"
         style="left:50%; animation-delay:4s;">
        ❤️
    </div>

    <div class="heart"
         style="left:70%; animation-delay:1s;">
        💗
    </div>

    <div class="heart"
         style="left:90%; animation-delay:3s;">
        ❤️
    </div>


    <script>


        const buttonArea =
            document.querySelector(
                ".button-area"
            );


        const noButton =
            document.getElementById("no");


        const yesButton =
            document.getElementById("yes");


        const question =
            document.getElementById("question");


        const success =
            document.getElementById("success");


        /* =================================
           MOVE NO BUTTON
        ================================= */

        function moveNoButton() {


            /*
                Get the size of the
                button area.
            */

            const areaWidth =
                buttonArea.clientWidth;

            const areaHeight =
                buttonArea.clientHeight;


            /*
                Get the actual size
                of the No button.
            */

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;


            /*
                Safety margin.

                This keeps the button
                away from the edges.
            */

            const margin = 10;


            /*
                Calculate maximum
                possible position.
            */

            const maxX =
                areaWidth -
                buttonWidth -
                margin;


            const maxY =
                areaHeight -
                buttonHeight -
                margin;


            /*
                Generate random
                position.
            */

            const x =
                margin +
                Math.random() *
                Math.max(
                    0,
                    maxX - margin
                );


            const y =
                margin +
                Math.random() *
                Math.max(
                    0,
                    maxY - margin
                );


            /*
                Move the button.
            */

            noButton.style.left =
                x + "px";

            noButton.style.top =
                y + "px";

            /*
                Remove the old
                transform because
                we now use exact
                coordinates.
            */

            noButton.style.transform =
                "none";
        }


        /* =================================
           NO BUTTON CLICK
        ================================= */

        noButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                moveNoButton();

            }
        );


        /* =================================
           YES BUTTON
        ================================= */

        yesButton.addEventListener(
            "click",
            function() {


                /*
                    Hide question.
                */

                question.style.display =
                    "none";


                /*
                    Show success.
                */

                success.classList.add(
                    "show"
                );


                /*
                    More hearts!
                */

                for (
                    let i = 0;
                    i < 30;
                    i++
                ) {

                    const heart =
                        document.createElement(
                            "div"
                        );


                    heart.className =
                        "heart";


                    heart.innerHTML =
                        Math.random() > 0.5
                        ? "❤️"
                        : "💖";


                    heart.style.left =
                        Math.random() * 100 +
                        "%";


                    heart.style.animationDuration =
                        3 +
                        Math.random() * 4 +
                        "s";


                    heart.style.fontSize =
                        15 +
                        Math.random() * 35 +
                        "px";


                    document.body.appendChild(
                        heart
                    );
                }

            }
        );

    </script>

</body>
</html>
```
